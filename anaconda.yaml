anaconda_config_version: 1
upstream_sources:
  - webpage:
      url: https://api.anaconda.org/package/conda-forge/cuda-compat
      regex: '"version":\s*"([^"]+)"'
    packages:
      - cuda-compat
      - cuda-compat-impl
  - webpage:
      url: https://api.anaconda.org/package/conda-forge/cuda
      regex: '"version":\s*"(13\.1(?:\.\d+)*)"'
    feedstock_branch: '13.1'
    version_matchspec: '>=13.1,<13.2'
    supported: true
    packages:
      - cuda-compat
      - cuda-compat-impl
  - webpage:
      url: https://api.anaconda.org/package/conda-forge/cuda
      regex: '"version":\s*"(13\.2(?:\.\d+)*)"'
    feedstock_branch: '13.2'
    version_matchspec: '>=13.2,<13.3'
    supported: true
    packages:
      - cuda-compat
      - cuda-compat-impl
